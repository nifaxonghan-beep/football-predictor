name: Update predictions

on:
  schedule:
    - cron: "17 6 * * *"      # every day at 06:17 UTC; the page only changes when new results or fixtures appear
  workflow_dispatch:           # lets you press "Run workflow" by hand

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the page from the latest results
        run: python build_app.py --out site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Note the run (helps GitHub keep the schedule switched on)
        run: |
          date -u +"%Y-%m-%d" > last-run.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add last-run.txt
          git commit -m "Daily update check" || true
          git push || true
